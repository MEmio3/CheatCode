[project]
name = "cinebot"
version = "0.1.0"
description = "Local Hall 6 group-booking console for STAR Cineplex Bangladesh"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "curl-cffi>=0.7",
    "playwright>=1.45",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-telegram-bot>=21",
    "python-dotenv>=1.0",
    "keyring>=25",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
cinebot = "cinebot.ui.app:main"
cinebot-recon = "cinebot.recon.capture:main"
cinebot-creds = "cinebot.config_store:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cinebot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
